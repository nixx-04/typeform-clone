[alembic]
# path to migration scripts
script_location = backend/alembic

# template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# prepend the current directory to sys.path
prepend_sys_path = .

sqlalchemy.url = sqlite:///./sqlite.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(asctime)s %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%(H):%%(M):%%(S)
